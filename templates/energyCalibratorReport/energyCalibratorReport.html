<link rel="stylesheet" href="energyCalibratorReport.css"/>

<template id='energyCalibratorDetectorReport'>
<div class='sectionWrapper item'>
<div class='col-md-12'>
<table id='{{id}}energyCalibratorDetectorResults' class='table energyCalibratorTable'></table>

<button type="button" class="btn btn-primary btn-lg" data-toggle="modal" data-target="#myAnalyzerModal">
<span class="glyphicon glyphicon-pencil" aria-hidden="true"></span> Write calibration to Analyzer
</button>
<br>
<button type="button" class="btn btn-primary btn-lg" data-toggle="modal" data-target="#myODBModal">
<span class="glyphicon glyphicon-pencil" aria-hidden="true"></span> Write calibration to ODB
</button>
<br>
<button type="button" class="btn btn-primary btn-lg"  id='saveCal'>
<span class="glyphicon glyphicon-pencil" aria-hidden="true"></span> Save Cal file
</button>
<input id='saveCalname' type='text' value='GRIFFIN-Cal-File.cal' width='500px'></input>

</div>
</div>

<!--are you sure modal for Analyzer write-->
<div class="modal fade" id="myAnalyzerModal" tabindex="-1" role="dialog" aria-labelledby="myAnalyzerModalLabel">
<div class="modal-dialog" role="document">
<div class="modal-content">
<div class="modal-header">
<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
<h4 class="modal-title" id="myAnalyzerModalLabel">Change values in Analyzer Config file?</h4>
</div>
<div class="modal-body">
<p>Are you sure you want to change the quadratic, gain and offset values for all selected detectors in the Analyzer? There is no undo.</p>
<input type='checkbox' id='{{id}}yesDefinitelyWriteAnalyzer'></input>
<label for='{{id}}yesDefinitelyWriteAnalyzer'>I'm very sure.</label>
</div>
<div class="modal-footer">
<button type="button" class="btn btn-default" data-dismiss="modal" id='dismissAnalyzermodal'>
<span class="glyphicon glyphicon-exclamation-sign" aria-hidden="true"></span> Abort
</button>
<button type="button" class="btn btn-default" id='{{id}}writeToAnalyzer' disabled>
<span class="glyphicon glyphicon-pencil" aria-hidden="true"></span> Write
</button>
</div>
</div>
</div>
</div>

<!--are you sure modal for ODB write-->
<div class="modal fade" id="myODBModal" tabindex="-1" role="dialog" aria-labelledby="myODBModalLabel">
<div class="modal-dialog" role="document">
<div class="modal-content">
<div class="modal-header">
<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
<h4 class="modal-title" id="myODBModalLabel">Change values in ODB?</h4>
</div>
<div class="modal-body">
<p>Are you sure you want to change the quadratic, gain and offset values for all selected detectors in the ODB? There is no undo.</p>
<input type='checkbox' id='{{id}}yesDefinitelyWriteODB'></input>
<label for='{{id}}yesDefinitelyWriteODB'>I'm very sure.</label>
</div>
<div class="modal-footer">
<button type="button" class="btn btn-default" data-dismiss="modal" id='dismissODBmodal'>
<span class="glyphicon glyphicon-exclamation-sign" aria-hidden="true"></span> Abort
</button>
<button type="button" class="btn btn-default" id='{{id}}writeToODB' disabled>
<span class="glyphicon glyphicon-pencil" aria-hidden="true"></span> Write
</button>
</div>
</div>
</div>
</div>
</template>


<template id='energyCalibratorCoefficienctsReport'>
<div class='sectionWrapper item'>
<div class='col-md-12'>
<table id='{{id}}energyCalibratorCoefficienctsResults' class='table energyCalibratorTable'></table>
</div>
</div>
</template>


<script>
function energyCalibratorReport(wrapID1,wrapID2){

  this.wrapID = wrapID1;
  this.wrap = document.getElementById(wrapID1);

  this.wrapID2 = wrapID2;
  this.wrap2 = document.getElementById(wrapID2);

  this.setup = function(){

    // Setup the Detector subpage
    //inject templates
    this.wrap.innerHTML = Mustache.to_html(
      dataStore.templates.energyCalibratorDetectorReport,
      {
        'id': this.wrapID,
      }
    );
    // table has to be done as a separate template, since templates and tables don't play too nice together
    // Build the list of rows for the table. Loop through each peak of each source
    var peaks =[];
    for(var i=0; i<dataStore.THESEcalibrations[0].y.length; i++){
      peaks.push(dataStore.THESEcalibrations[0].y[i]);
    }
    document.getElementById(this.wrapID + 'energyCalibratorDetectorResults').innerHTML= Mustache.to_html(
      dataStore.templates.energyCalibratorDetectorReportTable,
      content = {
        'id': this.wrapID,
        'peaks': peaks
      }
    );

    // Build Table select for selecting which detector data is displayed
    // Add the title text
    var newLabel = document.createElement("label");
    newLabel.for = 'tableMenuSelect';
    newLabel.id = 'tableMenuSelectLabel';
    newLabel.innerHTML = 'Detector: ';
    document.getElementById('tableMenuDiv').appendChild(newLabel);

    // Create a select input for the histo file list
    var newSelect = document.createElement("select");
    newSelect.id = 'tableMenuSelect';
    newSelect.name = 'tableMenuSelect';
    newSelect.onchange = function(){
      dataStore._energyCalibratorReport.refreshDetectorTableData(this.value);
    }.bind(newSelect);
    document.getElementById('tableMenuDiv').appendChild(newSelect);

    // Add the list of detectors as the options
    thisSelect = document.getElementById('tableMenuSelect');
    for(var j=0; j<dataStore.THESEdetectors.length; j++){
      thisSelect.add( new Option(dataStore.THESEdetectors[j], j) );
    }

    // Create the previous Detector button
    newButton = document.createElement('button');
    newButton.setAttribute('id', 'previousDetButton');
    newButton.setAttribute('class', 'btn btn-default btn-sm');
    newButton.innerHTML = "Previous Detector";
    newButton.style.padding = '4px';
    newButton.onclick = function(){
      var currentValue = parseInt(document.getElementById('tableMenuSelect').value);
      if(currentValue==0){ currentValue=1;}
      document.getElementById('tableMenuSelect').value = (currentValue-1);
      dataStore._energyCalibratorReport.refreshDetectorTableData(currentValue-1);
    }.bind(newButton);
    document.getElementById('tableMenuDiv').appendChild(newButton);

    // Create the next Detector button
    newButton = document.createElement('button');
    newButton.setAttribute('id', 'nextDetButton');
    newButton.setAttribute('class', 'btn btn-default btn-sm');
    newButton.innerHTML = "Next Detector";
    newButton.style.padding = '4px';
    newButton.onclick = function(){
      var currentValue = parseInt(document.getElementById('tableMenuSelect').value);
      if(currentValue==document.getElementById('tableMenuSelect').options.length-1){ currentValue=parseInt(document.getElementById('tableMenuSelect').options.length)-2;
    }
    document.getElementById('tableMenuSelect').value = (currentValue+1);
    dataStore._energyCalibratorReport.refreshDetectorTableData(currentValue+1);
  }.bind(newButton);
  document.getElementById('tableMenuDiv').appendChild(newButton);

  //make sure the file name for Cal file download gets passed around:
  document.getElementById('saveCalname').onchange = function(){
    //set the filename to whatever the user has requested:
    document.getElementById('saveCal').download = this.value;
  }

  // Set up the Cal file button
  document.getElementById('saveCal').onclick = function(){ buildCalfile(); }

  //set up fit callbacks
  dataStore.viewers[dataStore.plots[0]].fitCallback = this.fitCallback.bind(this);

  //plug in special fit controls
  document.getElementById('refitButton').onclick = this.toggleFitMode;

  //plug in the allow Analyzer write switch
  document.getElementById(this.wrapID + 'yesDefinitelyWriteAnalyzer').onchange = this.toggleAnalyzerwrite.bind(this);

  //plug in write to Analyzer button
  document.getElementById(this.wrapID + 'writeToAnalyzer').onclick = function(){
    //bail out if there's no fit yet
    if(Object.keys(dataStore.fitResults).length == 0){
      window.alert('You need to perform the gain match (see button at top of page) before writing results to the Analyzer.');
      document.getElementById('dismissAnalyzermodal').click();
    }
    updateAnalyzer();
  }

  //plug in the allow ODB write switch
  document.getElementById(this.wrapID + 'yesDefinitelyWriteODB').onchange = this.toggleODBwrite.bind(this);

  //plug in write to odb button
  document.getElementById(this.wrapID + 'writeToODB').onclick = function(){
    //bail out if there's no fit yet
    if(Object.keys(dataStore.fitResults).length == 0){
      window.alert('You need to perform the gain match (see button at top of page) before writing results to the ODB.');
      document.getElementById('dismissODBmodal').click();
    }
    promiseScript(dataStore.ODBrequests[0]);
  }

  // Setup the Coefficiencts Results subpage
  //inject templates
  this.wrap2.innerHTML = Mustache.to_html(
    dataStore.templates.energyCalibratorCoefficienctsReport,
    {
      'id': this.wrapID2,
    }
  );
  // table has to be done as a separate template, since templates and tables don't play too nice together
  // Build the list of rows for the table. Loop through each peak of each source
  var detectors =[];
  for(var i=0; i<dataStore.THESEdetectors.length; i++){
    detectors.push(dataStore.THESEdetectors[i]);
  }
  document.getElementById(this.wrapID2 + 'energyCalibratorCoefficienctsResults').innerHTML= Mustache.to_html(
    dataStore.templates.energyCalibratorCoefficientsReportTable,
    content = {
      'id': this.wrapID2,
      'detectors': detectors
    }
  );

},

this.refreshCoefficientsTableData = function(){

  for(var i=0; i<dataStore.THESEcalibrations.length; i++){
    var thisID = 'energyCalibratorResults'+dataStore.THESEcalibrations[i].name;
    document.getElementById(thisID+'quad').innerHTML = dataStore.THESEcalibrations[i].fit.quad.toPrecision(6);
    document.getElementById(thisID+'gain').innerHTML = dataStore.THESEcalibrations[i].fit.gain.toFixed(8);
    document.getElementById(thisID+'offset').innerHTML = dataStore.THESEcalibrations[i].fit.offset.toFixed(8);
    document.getElementById(thisID+'r2').innerHTML = dataStore.THESEcalibrations[i].fit.r2.toPrecision(10);
    document.getElementById(thisID+'residual').innerHTML = dataStore.THESEcalibrations[i].residualMean.toFixed(3);
  }

},

this.refreshDetectorTableData = function(thisDetectorIndex){

  for(var i=0; i<dataStore.THESEcalibrations[thisDetectorIndex].y.length; i++){
    var thisID = 'energyCalibratorDetector'+dataStore.THESEcalibrations[thisDetectorIndex].y[i];
    document.getElementById(thisID+'pulseHeightCentroid').innerHTML = dataStore.THESEcalibrations[thisDetectorIndex].xPH[i].toFixed(2);
    document.getElementById(thisID+'energyCentroid').innerHTML = dataStore.THESEcalibrations[thisDetectorIndex].xEn[i].toFixed(2);
    document.getElementById(thisID+'residual').innerHTML = dataStore.THESEcalibrations[thisDetectorIndex].residual[i].toFixed(4);
  }
  document.getElementById('reportCardDiv').innerHTML = "Mean of residuals = "+ dataStore.THESEcalibrations[thisDetectorIndex].residualMean.toFixed(2) +
  "keV, Variance of residuals = "+ dataStore.THESEcalibrations[thisDetectorIndex].residualVar.toFixed(2)+"keV";

  // Now also refresh the plot with the data from this Detector
  this.refreshDetectorPlotData(thisDetectorIndex);
},

this.fitAllSinglesPeaks = function(){
  //fit all spectra to the peaks defined.
  //this: efficiencyFitterReport object

  var i, keys = Object.keys(dataStore.spectrumListSingles);
  var buffer = dataStore.currentPlot; //keep track of whatever was originally plotted so we can return to it

  //dump data so there is one displayed at a time
  dataStore.viewers[dataStore.plots[0]].removeData(dataStore.currentPlot);

  releaser(
    function(i){
      var keys = Object.keys(dataStore.spectrumListSingles);
      this.fitSpectra(keys[i])
    }.bind(this),

    function(){
      var evt;
      //set up fit line re-drawing
      dataStore.viewers[dataStore.plots[0]].drawCallback = this.addFitLines;

      //comunicate with the user
      deleteNode('fittingSinglesMessage');
      document.getElementById('reviewMessage').classList.remove('hidden');

      //leave the viewer pointing at the first spectrum for fitting
      dispatcher({target: buffer}, 'fitAllComplete')

      // Set the current task to keep track of our progress
      dataStore.currentTask = 'Review';

      // Go to the post-fitting tasks
      this.postFittingTasks();

    }.bind(this),

    keys.length-1
  )
},

this.fitSpectra = function(spectrum){
  //redo the fits for the named spectrum.
  //<spectrum>: string; name of spectrum, per names from analyzer
  //this: efficiencyFitterReport object

  var viewerName = dataStore.plots[0];

  //set up fitting for this spectrum/source
  dataStore.currentPlot = spectrum;
  dataStore.viewers[viewerName].plotData() //kludge to update limits, could be nicer
  dataStore.viewers[viewerName].fitTarget = spectrum;
  dataStore._plotListLite.exclusivePlot(spectrum, dataStore.viewers[dataStore.plots[0]]);

  // Set the current Source for this spectrum
  dataStore.currentSource = Object.keys(dataStore.sourceInfo).find(key => dataStore.sourceInfo[key].histoFileName.split('.')[0] === spectrum.split(':')[0])

  //set the x axis valueRange
  document.getElementById('maxX').value = dataStore.sourceInfo[dataStore.currentSource].maxXValue;
  document.getElementById('maxX').onchange();

  // Set the current detector name (crystalIndex) for this spectrum
  dataStore.currentDetector = dataStore.THESEdetectors.indexOf(dataStore.currentPlot.split(':')[1].split('_')[0]);

  // fitting singles

  //set up the spectrum data for fitting
  dataStore.viewers[viewerName].addData(spectrum, JSON.parse(JSON.stringify(dataStore.rawData[spectrum])) );

  // Loop through all literature peaks for this source
  for(var i=0; i<dataStore.sourceInfo[dataStore.currentSource].literaturePeaks.length; i++){

    //set up peak fit
    dataStore.currentPeak = i;
    dataStore.viewers[viewerName].FitLimitLower = dataStore.ROI[dataStore.currentSource][dataStore.currentDetector][dataStore.currentPeak][0];
    dataStore.viewers[viewerName].FitLimitUpper = dataStore.ROI[dataStore.currentSource][dataStore.currentDetector][dataStore.currentPeak][1];
    dataStore.viewers[viewerName].fitData(spectrum, 0);
  }

  //dump data so it doesn't stack up
  dataStore.viewers[viewerName].removeData(spectrum);
},

this.addFitLines = function(){
  //add current fits to the plot

  var fitLines = [];
  var lower, upper, middle
  viewerName = dataStore.plots[0];

  dataStore.viewers[viewerName].containerFit.removeAllChildren();

  // Set the current Source for this spectrum
  dataStore.currentSource = Object.keys(dataStore.sourceInfo).find(key => dataStore.sourceInfo[key].histoFileName.split('.')[0] === dataStore.currentPlot.split(':')[0]);

  // Set the current detector name (crystalIndex) for this spectrum
  dataStore.currentDetector = dataStore.THESEdetectors.indexOf(dataStore.currentPlot.split(':')[1].split('_')[0]);

  // Set up the drop-down list of peaks available to refit
  var thisSelect = document.getElementById('refitSelect');
  thisSelect.removeAttribute('disabled');
  // Remove all options from the select
  thisSelect.innerHTML = "";

  // Loop through all peaks for this source
  for(var i=0; i<dataStore.sourceInfo[dataStore.currentSource].literaturePeaks.length; i++){
    //add fit lines
    fitLines[i] = dataStore.viewers[viewerName].addFitLine(
      dataStore.ROI[dataStore.currentSource][dataStore.currentDetector][i][0],
      dataStore.ROI[dataStore.currentSource][dataStore.currentDetector][i][1] - dataStore.ROI[dataStore.currentSource][dataStore.currentDetector][i][0],
      dataStore.fitResults[dataStore.currentPlot][i][0],
      dataStore.fitResults[dataStore.currentPlot][i][1],
      dataStore.fitResults[dataStore.currentPlot][i][2],
      dataStore.fitResults[dataStore.currentPlot][i][3],
      dataStore.fitResults[dataStore.currentPlot][i][4]
    );

    // Add this fitline to the canvas
    dataStore.viewers[viewerName].containerFit.addChild(fitLines[i]);

    //add this peak as an option to the refit select
    var newSelect = document.createElement("select");
    thisSelect.add( new Option("Peak "+i+", "+dataStore.sourceInfo[dataStore.currentSource].literaturePeaks[i]+"keV", i) );
  }

    // Enable the refit button in apps which have this
    var refitButton = document.getElementById('refitButton');
    if(refitButton != null){
      refitButton.removeAttribute("disabled");
    }

  dataStore.viewers[viewerName].stage.update();
},

this.fitCallback = function(center, width, amplitude, intercept, slope){
  //after fitting, log the fit results, as well as any modification made to the ROI by the fitting algortihm
  //also update table
  //<center>: number; center of gaussian peak
  //<width>: number; width of peak
  //<amplitude>: number; amplitude of peak
  //<intercept>: number; intercept of linear background beneath peak
  //<slope>: number; slope of linear background
  //this: gainMatchReport object

  var viewerName = dataStore.plots[0];

  // update the progress bar
  dataStore.progressBarTasksCompleted++;
  document.getElementById('progress').setAttribute('style', 'width:' + (100*(dataStore.progressBarTasksCompleted / dataStore.progressBarNumberTasks)) + '%' );

  // fitting singles

  //keep track of fit results
  if(!dataStore.fitResults[dataStore.currentPlot]) dataStore.fitResults[dataStore.currentPlot] = [];
  dataStore.fitResults[dataStore.currentPlot][dataStore.currentPeak] = [amplitude, center, width, intercept, slope];

  // Update the ROI in case they were modified by the fitting routine
  dataStore.ROI[dataStore.currentSource][dataStore.currentDetector][dataStore.currentPeak][0] = dataStore.viewers[viewerName].FitLimitLower;
  dataStore.ROI[dataStore.currentSource][dataStore.currentDetector][dataStore.currentPeak][1] = dataStore.viewers[viewerName].FitLimitUpper;

  //remember resolution data here
  dataStore.sourceInfo[dataStore.currentSource].FWHM[dataStore.currentPeak] = (width*2.35).toFixed(2);

  // Remember the data points here
  // Calculate the Pulse Height from this Energy centroid
  var thisCalibrationIndex = dataStore.sourceInfo[dataStore.currentSource].Config.map(function(e) { return e.name; }).indexOf(dataStore.THESEdetectors[dataStore.currentDetector]);
  var a = dataStore.sourceInfo[dataStore.currentSource].Config[thisCalibrationIndex].quad;
  var b = dataStore.sourceInfo[dataStore.currentSource].Config[thisCalibrationIndex].gain;
  var c = dataStore.sourceInfo[dataStore.currentSource].Config[thisCalibrationIndex].offset;
  c -= center;
  if(a==0){ a = 1.0E-12; }
  var thisPulseHeight = (-1.0*b + Math.sqrt(b*b - (4*a*c))) / (2.0*a);

  var thisPeakIndex = dataStore.THESEcalibrations[dataStore.currentDetector].y.indexOf(dataStore.sourceInfo[dataStore.currentSource].literaturePeaks[dataStore.currentPeak]);
  dataStore.THESEcalibrations[dataStore.currentDetector].xPH[thisPeakIndex] = thisPulseHeight;

    //disengage fit mode button in apps which use this
    var refitButton = document.getElementById('refitButton');
    if(refitButton != null){
      if( parseInt(refitButton.getAttribute('engaged'),10) == 1){
        refitButton.onclick();
      }
    }

  if(dataStore.currentTask == "Finished"){
    // This is a refit of a peak, so trigger recalculation of coefficients and table updates
    this.fitEnergyCalibrationData(dataStore.currentDetector);
    this.refreshCoefficientsTableData();
    this.refreshDetectorTableData(dataStore.currentDetector);
    console.log(dataStore);
  }
  return;
},

this.postFittingTasks = function(){

  // Fit a quadratic function to each set of centroid data
  for(var i=0; i<dataStore.THESEdetectors.length; i++){
    this.fitEnergyCalibrationData(i);
  }

  // Report all results in a table
  this.refreshCoefficientsTableData();
  // Here populate the table for the first time with the results for the first detector
  this.refreshDetectorTableData(0);

  // We are finished
  dataStore.currentTask = 'Finished';
  document.getElementById('progress').setAttribute('style', 'width:' + (100) + '%' );
  console.log(dataStore);
},

this.fitEnergyCalibrationData = function(thisDetector){
  // Format the data for this detector
  var data = [];

  for(var j=0; j<dataStore.THESEcalibrations[thisDetector].xPH.length; j++){
    data.push([dataStore.THESEcalibrations[thisDetector].xPH[j],dataStore.THESEcalibrations[thisDetector].y[j]]);
  }

  // Hats off to Tom Alexander, https://github.com/Tom-Alexander/regression-js
  const result = regression.polynomial(data, { order: 2, precision: 20 });

  // Save the fit results into the object for this detector
  dataStore.THESEcalibrations[thisDetector].fit.quad = result.equation[0];    // The coefficient of the quadratic term of the equation
  dataStore.THESEcalibrations[thisDetector].fit.gain = result.equation[1];    // The coefficient of the slope term of the equation
  dataStore.THESEcalibrations[thisDetector].fit.offset = result.equation[2];  // The coefficient of the offset term of the equation
  dataStore.THESEcalibrations[thisDetector].fit.string = result.string;       //  A string representation of the equation
  dataStore.THESEcalibrations[thisDetector].fit.r2 = result.r2;               // the coefficient of determination (R^2)

  // Also save the address which is needed in the Cal file
  // Need to find a source that was not excluded.
  // Just use whatever is in the first position in the object becasue excluded sources have been deleted.
  var keys = Object.keys(dataStore.sourceInfo);
  var thisSource = dataStore.sourceInfo[keys[0]].title;
  var thisCalibrationIndex = dataStore.sourceInfo[thisSource].Config.map(function(e) { return e.name; }).indexOf(dataStore.THESEdetectors[thisDetector]);
  dataStore.THESEcalibrations[thisDetector].address = dataStore.sourceInfo[thisSource].Config[thisCalibrationIndex].address;

  dataStore.THESEcalibrations[thisDetector].residualMean = 0;
  for(var j=0; j<dataStore.THESEcalibrations[thisDetector].xPH.length; j++){
    var x = dataStore.THESEcalibrations[thisDetector].xPH[j];
    // Calculate the Energy centroids from the new coefficients
    dataStore.THESEcalibrations[thisDetector].xEn[j] = (x*x*dataStore.THESEcalibrations[thisDetector].fit.quad) + (x*dataStore.THESEcalibrations[thisDetector].fit.gain) + dataStore.THESEcalibrations[thisDetector].fit.offset;
    // Calculate the residuals of the re-calibrated peak centroids
    dataStore.THESEcalibrations[thisDetector].residual[j] = dataStore.THESEcalibrations[thisDetector].y[j] - dataStore.THESEcalibrations[thisDetector].xEn[j];
    dataStore.THESEcalibrations[thisDetector].residualMean += Math.abs(dataStore.THESEcalibrations[thisDetector].residual[j]);
  }
  dataStore.THESEcalibrations[thisDetector].residualMean /= dataStore.THESEcalibrations[thisDetector].residual.length;

  dataStore.THESEcalibrations[thisDetector].residualVar = 0;
  var mean = dataStore.THESEcalibrations[thisDetector].residualMean;
  for(var j=0; j<dataStore.THESEcalibrations[thisDetector].xPH.length; j++){
    dataStore.THESEcalibrations[thisDetector].residualVar +=
    (Math.abs(dataStore.THESEcalibrations[thisDetector].residual[j]) - mean) * (Math.abs(dataStore.THESEcalibrations[thisDetector].residual[j]) - mean);
  }
  dataStore.THESEcalibrations[thisDetector].residualVar /= dataStore.THESEcalibrations[thisDetector].residual.length;

},

this.updateEnergies = function(){
  //callback for the calibration source dropdown; updates energy input boxes with standard values
  //this: gainMatchReport object

  var calibrationSourceName = getSelected(this.wrapID + 'calibrationSource');

  // Find the index number for the source information for this sourceType
  var index = dataStore.sourceInfo.map(function(e) { return e.name; }).indexOf(calibrationSourceName);

  // Set the peak energies for this source
  document.getElementById('peak1').value  = dataStore.sourceInfo[index].lowEnergy;
  document.getElementById('peak2').value  = dataStore.sourceInfo[index].midEnergy;
  document.getElementById('peak3').value = dataStore.sourceInfo[index].highEnergy;
  document.getElementById('peak4').value  = dataStore.sourceInfo[index].vhiEnergy;

},

this.customEnergy = function(){
  //callback for changing the calibration energies to custom values
  //this: gainMatchReport object

  var i, keys = Object.keys(dataStore.fitResults)
  var defaultSources = document.getElementById(this.wrapID + 'calibrationSource')

  defaultSources.value = 'custom'
},

this.toggleFitMode = function(){
  //gain matcher needs special fit controls for convenience
  //this: fit mode engage button element

  var viewerName = dataStore.plots[0];

  if(parseInt(this.getAttribute('engaged'),10) == 0){
    dataStore.viewers[viewerName].setupFitMode();
    this.setAttribute('engaged', 1);
    if(this.id == 'refitButton')
    document.getElementById('refitButtonBadge').classList.add('red-text')
  }
  else{
    dataStore.viewers[viewerName].leaveFitMode();
    this.setAttribute('engaged', 0);
    if(this.id == 'refitButton')
    document.getElementById('refitButtonBadge').classList.remove('red-text')
  }

  // Set the peak index in the datastore
  dataStore.currentPeak = document.getElementById('refitSelect').value;

},

this.toggleAnalyzerwrite = function(){
  //toggle Analyzer writing permission.

  var allowed = document.getElementById(this.wrapID + 'yesDefinitelyWriteAnalyzer').checked

  if(allowed)
  document.getElementById(this.wrapID + 'writeToAnalyzer').removeAttribute('disabled');
  else
  document.getElementById(this.wrapID + 'writeToAnalyzer').setAttribute('disabled', true);
}

this.toggleODBwrite = function(){
  //toggle odb writing permission.

  var allowed = document.getElementById(this.wrapID + 'yesDefinitelyWriteODB').checked

  if(allowed)
  document.getElementById(this.wrapID + 'writeToODB').removeAttribute('disabled');
  else
  document.getElementById(this.wrapID + 'writeToODB').setAttribute('disabled', true);
}

this.toggleAllODBWrites = function(){
  // make each channel's odb write toggle match the master switch

  var toggles = document.getElementsByClassName('write-to-odb'),
  master = document.getElementById('writeAllChannels'),
  state = master.checked,
  i;

  for(i=0; i<toggles.length; i++){
    toggles[i].checked = state;
  }

},

this.refreshDetectorPlotData = function(thisDetectorIndex){
  //arrange the latest residual info for representation in the dygraph.

  // Build the flags array. All zeros but needs to be the correct length
  var plotIndex = 0; // Plot 0 is the detector results plot
  var i, evt, dataIndex = [],
  flags = [];
  flags.fillN(0, dataStore.THESEcalibrations[thisDetectorIndex].residual.length)

  // Update the Y axis scale for these data
  var max = 0;
  for(i=0; i<dataStore.THESEcalibrations[thisDetectorIndex].residual.length; i++){
    if(Math.abs(dataStore.THESEcalibrations[thisDetectorIndex].residual[i])>max){
      max = Math.abs(dataStore.THESEcalibrations[thisDetectorIndex].residual[i]);
    }
  }
  dataStore.YAxisMinValue[plotIndex][0] = -1.0 * max * 1.33;
  dataStore.YAxisMaxValue[plotIndex][0] = max * 1.33;

  dataStore.dataplotData[plotIndex] = arrangePoints(dataStore.THESEcalibrations[thisDetectorIndex].y, [dataStore.THESEcalibrations[thisDetectorIndex].residual], flags );
  var eventString = 'updateDyData'+plotIndex;
  dispatcher({ 'data': dataStore.dataplotData[plotIndex] }, eventString);
}

}
